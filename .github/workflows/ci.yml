name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build never calls YouCam; a placeholder key keeps the health route honest.
      - run: npm run build
        env:
          YOUCAM_API_KEY: ci-placeholder
